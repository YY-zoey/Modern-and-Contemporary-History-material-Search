# 史料 PDF 持续检索与证据库维护 Skill

## 一、任务目标

持续处理指定文件夹中的全部 PDF，并维护同一文件夹内的：

`史料检索汇编.docx`

本任务以建立可供研究写作、史实判断和引文核对使用的证据库为目标。所有正式条目必须经过 PDF 原页核验。OCR、文本提取和关键词检索只能用于连续阅读、发现线索与定位页面，不得代替原页核验。

除非用户明确叫停，否则持续从未完成处续作。每个自然日至少处理 2 份 PDF；如单份 PDF 篇幅极大，应持续推进并如实记录页码进度，不得虚报完成。

---

## 二、任务参数

每次创建或首次运行任务时，应从用户指令、配置文件或现有汇编文档中读取以下参数：

- 【研究主题】
- 【核心问题】
- 【重点检索】
- 【主题分类】
- 【输入文件夹】
- 【输出文档名称】
- 【最低处理数量】
- 【特殊核验要求】

不得自行补写用户未提供的具体研究对象、人物、地区、机构、年代或结论。

如研究主题、核心问题或重点检索暂为空，应保留空白配置项，不得根据文件内容擅自替用户确定研究方向。

建议在工作目录内建立：

`史料检索任务配置.md`

配置模板：

```markdown
# 史料检索任务配置

【研究主题】

【核心问题】

【重点检索】

【主题分类】

【输入文件夹】史料

【输出文档名称】史料检索汇编.docx

【最低处理数量】每日不少于 2 份 PDF

【特殊核验要求】
```

---

## 三、检索原则

1. 严格逐份阅读，不按关键词筛选文件。
2. 关键词只作为阅读线索和页面定位辅助。
3. 阅读范围、材料取舍和主题分类必须服从用户提供的研究主题与核心问题。
4. 每条重要材料均须阅读前后文，确认主语、对象、时间、地区、语境和材料性质。
5. 收录能够支持、修正、限制或否定预设判断的材料。
6. 不得因材料不符合预设结论而忽略。
7. 不得将目录、摘要、OCR 文本或二手转引当作已经核验的正文史料。
8. 不得只看篇名或关键词命中段落即建立正式条目。
9. 对明显无关内容可以跳过，但必须能够说明判断依据。
10. 对篇名含义不明确、材料边界不清或可能间接相关的内容，应列入核读范围。

---

## 四、默认文件位置

### 1. 输入目录

默认使用桌面文件夹：

`史料`

如用户指定其他目录，以用户指定路径为准。

### 2. 主输出文件

默认在输入目录内维护：

`史料检索汇编.docx`

如用户指定其他文件名，以用户指定名称为准。

### 3. 断点与结构化数据文件

在输入目录内建立轻量化工作文件，建议命名为：

- `.史料检索断点.json`
- `.史料检索条目.jsonl`
- `.史料检索页码索引.json`
- `.史料检索日志.md`
- `史料检索任务配置.md`

这些文件用于记录已读页码、候选页、已核页、条目编号、重复文件、异常情况和 Word 更新状态。不得用断点文件替代 Word 文档中的正式进度表。

---

## 五、启动规则

每次启动必须依次执行：

1. 确认输入文件夹存在。
2. 确认或创建任务配置文件。
3. 确认或创建“史料检索汇编.docx”。
4. 读取 Word 文档开头的处理进度表。
5. 读取任务配置和断点文件。
6. 如断点文件与 Word 冲突，以能够由原始 PDF、原页核验记录和已保存条目证明的状态为准。
7. 扫描文件夹内全部 PDF。
8. 按文件名在文件管理器中显示的自然顺序排序。
9. 找到第一份未完成 PDF，从该文件继续。
10. 不得重复处理已经完成且核验记录完整的 PDF。
11. 若某文件标为完成但缺少原页核验依据，应回退为“待复核”。
12. 检查上次是否存在尚未写入 Word 的结构化条目。
13. 检查 Word 与结构化数据中的最后条目编号是否一致。

---

## 六、首次运行规则

首次运行时必须：

1. 列出输入文件夹内全部 PDF。
2. 按自然顺序编号。
3. 将完整清单写入 Word 文档开头。
4. 为每份 PDF 创建进度记录。
5. 标明总文件数。
6. 不得仅依赖操作系统返回顺序，必须进行自然排序，例如：
   - `第2卷.pdf` 排在 `第10卷.pdf` 前；
   - `上册.pdf`、`中册.pdf`、`下册.pdf` 按文件名实际显示逻辑排列。
7. 文件新增后，应追加进清单并标明“后续新增”，不得扰乱已处理文件的历史记录。
8. 将任务参数写入 Word 文档开头，未填写项目保持空白。
9. 不得在首次运行时自动生成具体研究结论或固定分类。

---

## 七、进度表

Word 文档开头保留处理进度表，至少包括：

| 顺序 | 文件名 | 状态 | 当前进度/筛查范围 | 完成时间 | 重要史料条数 | 备注 |
|---|---|---|---|---|---:|---|

### 状态只能使用下列规范表述

- 未开始
- 处理中
- 已完成目录筛查并核读相关篇目
- 已通读，暂未发现相关史料
- 已完成目录筛查并核读相关篇目，暂未发现相关史料
- 重复 PDF，已核对，不重复摘录
- 待复核
- 文件异常
- 无法打开
- OCR 处理中
- Word 待写入

不得将仅完成关键词搜索、目录查看或 OCR 提取的文件标为完成。

### 完成时间

使用本地时间，格式：

`YYYY-MM-DD HH:mm`

### 重要史料条数

只统计已经写入 Word 且完成原页核验的正式条目。

以下内容不得计入正式重要史料条数：

- 待核线索
- OCR 待复核材料
- 页码索引
- 重复材料提示
- 尚未写入 Word 的候选条目

---

## 八、PDF 处理顺序

1. 严格按照文件清单中的自然顺序逐份处理。
2. 一份 PDF 完成后，立即更新结构化数据、断点和进度表。
3. 未经用户明确要求，不得跳到后面的 PDF。
4. 如当前 PDF 损坏、加密或无法读取，可标记异常后处理下一份，但必须保留待办状态。
5. 重复 PDF 必须核对文件内容、页数、目录、版本和扫描差异后再判断。
6. 内容重复但版本、页码、增补材料或编校信息不同的，不得简单视为完全重复。
7. 新增 PDF 原则上追加到现有清单末尾；如用户要求重新排序，应保留原处理记录和调整说明。
8. 不得因为某份 PDF 预计相关性较低而改变既定处理顺序。

---

## 九、阅读策略

### 1. 总体原则

严格逐份阅读，不按关键词筛选文件。关键词只作为线索和定位辅助。

阅读时应先掌握：

- 目录
- 篇名
- 年代
- 作者或发文机关
- 文献类型
- 卷册结构
- 页码体系
- 前后文关系
- 材料生成背景
- 材料与研究主题的关系

### 2. 优先完整阅读的材料

以下材料应结合目录、篇名和上下文完整阅读：

- 综合报告
- 工作总结
- 调查报告
- 会议记录
- 指示
- 决定
- 决议
- 通知
- 计划
- 请示
- 批复
- 制度文件
- 人事材料
- 组织材料
- 统计材料
- 政策执行报告
- 机构调整材料
- 重要当事人回忆
- 能够反映制度、组织、人员、权力关系或政策变化的材料

用户另有指定时，以用户列出的优先材料类型为准。

### 3. 疑似相关篇目

对疑似相关篇目，应先阅读：

- 开头
- 结尾
- 关键段落
- 前后相邻页面

再决定是否通读全文。

### 4. 可跳过内容

对明显无关内容，例如：

- 纯技术说明
- 与研究问题无关的设备参数
- 单纯数据罗列
- 重复目录
- 空白页
- 广告页
- 与研究主题无关的附录

可以跳过，但必须确保篇名、目录和内容边界明确。

### 5. 不得仅凭篇名排除

若目录名称、篇名或栏目含义不明确，必须列入核读范围。

### 6. 完成表述

采用篇目筛查方式的 PDF，不得写“已通读”，应写：

`已完成目录筛查并核读相关篇目`

并在备注或“当前进度/筛查范围”中注明：

- 已查看目录范围
- 已核读篇目
- 跳过篇目类型
- 判断依据

---

## 十、本地文本提取与 OCR

### 1. 批量处理

全部页面先在本地进行文本提取或 OCR，用于连续阅读和发现线索。

### 2. OCR 的用途

OCR 只用于：

- 连续通读
- 搜索线索
- 发现相关页面
- 初步识别篇名、日期和机构
- 建立候选页清单
- 辅助判断页面方向和版式

OCR 不得直接作为正式引文依据。

### 3. 阅读方式

按页连续阅读提取文本，不依赖关键词筛选文件。

### 4. 弹性批次

每轮处理约 60—100 页：

- 候选材料密集时缩小批次；
- 材料稀疏时扩大批次；
- 不强求每轮 200 页；
- 批次边界不得截断篇章、报告或上下文；
- 遇到跨页表格、跨页引文或连续文件时，应延长到完整单元结束。

---

## 十一、原页核验

### 1. 核验触发

只有发现相关材料后，才加载该页及前后页原图。

### 2. 核验步骤

1. 先看低分辨率整页，确认篇名、上下文和页面结构。
2. 再放大包含引文的区域。
3. 必要时查看前一页和后一页。
4. 核对主语、对象、时间、地区、机关、文种和语境。
5. 逐字校对引文。
6. 分别记录书内页码与 PDF 页码。
7. 更新已核页记录。
8. 检查引文是否跨页、是否缺少前置主语或限制条件。
9. 检查该段是否属于正文、注释、编者按、转引或附录。

### 3. 重点核对内容

- 人名
- 地名
- 机构名称
- 职务
- 数字
- 日期
- 否定词
- 程度词
- 范围词
- 引号
- 句读
- 页码
- 文种
- 发文机关
- 落款
- 版本差异
- 表格行列关系

### 4. 禁止事项

不得擅自补充：

- 主语
- 发文机关
- 时间
- 地区
- 组织层级
- 因果关系
- 逻辑连接
- 原文中没有的判断

### 5. 字迹不清

无法确认时写：

`〔字迹不清，待核〕`

不得凭常识、OCR 或上下文自行补字。

### 6. 未核原页

未查看原页的内容只能标为：

`待核线索`

不得写入正式已核条目，不得生成建议引文格式，不得计入重要史料条数。

---

## 十二、条目建立标准

每条正式史料必须独立建立条目，包含以下字段：

- 【序号】
- 【完整书名】
- 【所属 PDF 文件】
- 【篇名】
- 【作者或发文机关】
- 【形成时间】
- 【书内页码】
- 【PDF 页码】
- 【史料原文】
- 【直接信息】
- 【隐含信息与分析】
- 【服务的研究问题】
- 【主要分类】
- 【关联主题】
- 【适用范围】
- 【证明限度】
- 【材料性质】
- 【核验状态】
- 【建议引文格式】

### 字段填写规范

#### 【序号】

全库连续编号，不因主题章节重新编号。

每次更新 Word 前检查：

- 断号
- 重号
- 重复条目
- 已删除条目留下的空号
- Word 与结构化数据编号不一致

#### 【完整书名】

包含卷、册、上中下卷等信息。版权页可核时，补充：

- 编者或作者
- 出版地
- 出版社
- 出版年份
- 版本信息

未核版权页时不得自行补全。

#### 【所属 PDF 文件】

填写文件夹内的完整文件名，包括扩展名。

#### 【篇名】

填写文章、报告、指示、决定、回忆、章节或其他文献单元的完整标题。

无明确篇名时，如实写：

`篇名未标`

并说明所在章节、栏目或页面位置。

#### 【作者或发文机关】

只填写原文明确出现的信息。

无法确认时写：

- 未标
- 待核

#### 【形成时间】

使用材料原载日期。

只有出版时间而无形成时间时，不得将出版时间冒充形成时间。

#### 【书内页码】

记录书籍自身印刷页码。

无书内页码时写：

`书内页码未标`

#### 【PDF 页码】

记录 PDF 阅读器中的页码，从 1 开始计数。

不得与文件内部印刷页码混淆。

#### 【史料原文】

- 保留原词。
- 保留基本标点。
- 不得改变原意。
- 不得把不同段落、不同页或不同来源拼接成一句。
- 如因篇幅省略，使用规范省略号，并确保不改变主语、范围和逻辑。
- 必须阅读前后文，避免断章取义。
- 原文存在明显错字时，原则上照录，并用适当方式注明。
- 原文中的旧字、异体字、繁体字是否转换，遵循用户要求；未指定时保留原貌。

#### 【直接信息】

只写材料明确表达的事实，不加入推断。

#### 【隐含信息与分析】

使用审慎措辞，例如：

- 可见……
- 反映出……
- 可能说明……
- 在该地区和该时段内可以观察到……
- 这一材料提示……
- 结合上下文可以初步判断……

不得将推论写成确定事实。

#### 【服务的研究问题】

填写该条材料能够回答、支持、修正或限制的具体问题。

不得填入超出原文证明范围的宏大结论。

#### 【主要分类】

填写该条材料在 Word 正文中的唯一主要归属。

#### 【关联主题】

可以填写多个，但不得因此复制正文条目。

#### 【适用范围】

明确限定：

- 时间
- 地区
- 部门
- 群体
- 机构
- 组织层级
- 材料涉及的对象
- 特定政策或事件

#### 【证明限度】

说明该材料不能证明什么，防止扩大解释。例如：

- 只能说明特定地区或机构的情况，不能代表更大范围。
- 只能说明报告者的观察，不能直接证明实际执行效果。
- 只能证明某问题被提出，不能证明该问题普遍存在。
- 只能证明措施已经部署，不能证明措施已经落实。
- 回忆形成较晚，需要与同时期材料互证。
- 统计口径不明，不能直接进行跨时期比较。
- 材料可能具有汇报、宣传、自我辩护或事后解释性质。

#### 【材料性质】

可填写：

- 指示
- 决定
- 决议
- 通知
- 请示
- 批复
- 会议记录
- 工作报告
- 工作总结
- 调查报告
- 统计材料
- 制度文件
- 日记
- 书信
- 报刊材料
- 回忆录
- 口述史
- 编者整理材料
- 后来汇编材料
- 其他

#### 【核验状态】

只能使用：

- 已核对原页
- OCR 待复核
- 待核线索

正式条目原则上必须为“已核对原页”。

#### 【建议引文格式】

仅在以下条件全部满足时填写：

1. 已核原页；
2. 完整书名已核；
3. 篇名已核；
4. 作者或发文机关已核；
5. 书内页码已核；
6. 出版信息可核；
7. 未混淆形成时间与出版时间。

条件不全时写：

`暂不生成，书目信息或页码待核`

---

## 十三、Word 文档结构

文档开头依次保留：

1. 任务说明
2. 任务参数
3. PDF 文件清单
4. 处理进度表
5. 分类说明
6. 正文证据库

### 正文一级标题

正文按用户提供的【主题分类】组织。

如用户已经明确分类，严格沿用用户分类，不得擅自改名、合并或增删。

如用户未提供分类，暂设：

# 待分类材料

后续取得明确分类后，再统一调整。

### 正文二级标题

每个主题一级标题下，以具体材料的文章、报告、指示、决定、回忆、章节或其他文献单元为二级标题。

### 来源标识

每条史料必须保留：

- 所属 PDF 文件名
- 完整书名
- 篇名
- 双页码
- 作者或发文机关
- 形成时间
- 核验状态

不得因按主题分类而遗漏来源。

### 关联主题

同一条史料只建立一个正式条目。若同时涉及多个主题：

1. 放入最主要的主题章节；
2. 在【服务的研究问题】中列出其他相关问题；
3. 在【关联主题】中记录其他主题；
4. 必要时在其他章节设置交叉索引；
5. 不得复制全文并伪装为多份独立证据。

---

## 十四、分类规则

### 1. 主要分类

根据材料主要解释对象和用户设定的研究问题决定正文归属。

### 2. 关联主题

可以记录多个关联主题，但只能有一个主要分类。

### 3. 分类不得改变证据

不得为了适应分类：

- 改写原文；
- 删去限制条件；
- 强化因果；
- 擅补主语；
- 把同一条材料拆成多条虚假证据。

### 4. 后续新增材料

完成原页核验后，直接写入相应主题章节。

### 5. 每次更新前检查

- 条目序号是否连续；
- 是否出现重复条目；
- 是否遗漏来源标题；
- 主要分类是否准确；
- 关联主题是否一致；
- 页码是否混淆；
- 核验状态是否真实；
- 分类是否与当前任务配置一致。

---

## 十五、重复材料处理

### 1. 重复 PDF

核对以下内容：

- 文件哈希
- 总页数
- 目录
- 扫描质量
- 页码
- 版本
- 增补内容
- 编者和出版信息

确认完全重复后，进度表标记：

`重复 PDF，已核对，不重复摘录`

并注明重复于哪一文件。

### 2. 同一事实的不同来源

必须分别建立条目，不得拼接。

不同来源可以独立证明同一事实，也可能存在立场、时间、记忆和信息来源差异。

### 3. 同一来源的重复叙述

先建立页码索引。只有具备以下价值时才另立条目：

- 提供新的事实；
- 提供不同时间点；
- 提供不同组织层级；
- 提供不同地区；
- 提供不同观察者；
- 对原有判断形成修正或限制；
- 具有独立证据价值。

### 4. 禁止拼接

禁止将以下内容拼接成一条连续引文或一项单一事实：

- 不同来源
- 不同篇目
- 不同日期
- 不同地区
- 不同机构
- 不同组织层级
- 正文与编者说明
- 原始材料与后来回忆

---

## 十六、断点管理

断点文件至少记录：

```json
{
  "current_pdf": "",
  "current_pdf_index": 0,
  "last_read_pdf_page": 0,
  "screened_ranges": [],
  "candidate_pages": [],
  "verified_pages": [],
  "pending_pages": [],
  "last_entry_number": 0,
  "last_word_update_time": "",
  "last_successful_save": "",
  "notes": []
}
```

### 断点原则

1. 启动时优先读取断点。
2. 不反复解析整份 Word。
3. 不重复加载已核页面。
4. 每完成一个阅读批次更新断点。
5. 每完成一份 PDF 或累计约 100 页后集中更新一次 Word。
6. 每完成一份 PDF，必须立即保存 Word，不得等多份文件一起保存。
7. 如果程序异常退出，应从最近一次已保存断点恢复。
8. 断点状态不得高于实际核验状态。
9. 删除或修改条目时，应保留变更记录。
10. Word、结构化数据和断点三者冲突时，不得自动覆盖，必须先核查。

---

## 十七、写入与保存策略

1. 先将条目写入结构化数据。
2. 完成一份 PDF，或累计约 100 页后，集中写入 Word。
3. 每完成一份 PDF，立即更新进度表并保存 Word。
4. Word 保存成功后再标记该 PDF 完成。
5. 保存后检查文件存在、修改时间变化且可重新打开。
6. 不逐轮渲染整份 Word。
7. 不在每个条目后反复解压、修改和检查 Word。
8. 全部 PDF 处理完后，再进行完整排版检查。
9. 保存失败时不得标记完成，应保留结构化条目和断点并记录错误。
10. 更新 Word 前应创建临时备份；确认新文件可打开后再替换正式文件。
11. 不得覆盖用户手工修改但尚未合并的内容。
12. 发现 Word 内已有人工批注或修订痕迹时，应保留并记录。

---

## 十八、分析边界

必须遵守以下证据边界：

1. 不把个案扩大为整体。
2. 不把某一地区、机构或时期的情况扩大到其他范围。
3. 不以后来采取某项措施，反推此前该问题必然存在。
4. 不把“提出要求”写成“已经落实”。
5. 不把“计划、部署、决定”写成“实际结果”。
6. 不把报告者的判断直接等同于客观事实。
7. 不把回忆材料与同时期原始材料混为同等性质。
8. 严格区分：
   - 原文
   - 忠实转述
   - 分析推论
9. 不同来源分别记录，禁止拼接。
10. 收录能够修正、限制或否定预设判断的材料。
11. 对矛盾记载应分别保留，不强行调和。
12. 无法确认时明确写“待核”，不得猜测。
13. 不以材料数量替代证据质量。
14. 不因某一材料措辞强烈，就扩大其实际覆盖范围。
15. 不因材料出自正式机关，就默认其陈述已经得到落实。
16. 不因回忆者身份重要，就免除外部互证。

---

## 十九、材料价值判断

一条材料具备下列任一价值时，可列为候选：

- 直接说明研究对象的事实；
- 揭示制度、组织、人员或权力关系；
- 说明政策、措施或制度的形成过程；
- 反映执行过程及其阻力；
- 提供明确时间节点；
- 提供地区、机构或群体差异；
- 提供统计、名单、组织沿革或人事变动；
- 反映当事人的立场、认识和行动意图；
- 能修正已有判断；
- 能限制某项结论的适用范围；
- 与其他来源形成互证或矛盾；
- 可以支持研究写作、史实核对或引文复查。

仅有一般口号、重复性表态或缺少具体对象的材料，可以建立页码索引，不必全部形成正式条目。

---

## 二十、单份 PDF 完成条件

一份 PDF 只有在满足相应条件后才能标记完成。

### 情形 A：相关材料较多

必须完成：

- 目录筛查；
- 相关篇目阅读；
- 候选材料前后文阅读；
- 正式条目原页核验；
- 双页码记录；
- 分类写入；
- 重复检查；
- Word 保存；
- 进度表更新。

状态写：

`已完成目录筛查并核读相关篇目`

### 情形 B：全文未发现相关材料

只有在达到真实通读标准后，方可写：

`已通读，暂未发现相关史料`

### 情形 C：采用目录筛查和相关篇目核读，但未发现材料

状态写：

`已完成目录筛查并核读相关篇目，暂未发现相关史料`

并注明筛查范围和核读篇目。

### 情形 D：重复文件

完成版本和内容核对后写：

`重复 PDF，已核对，不重复摘录`

### 情形 E：无法完成

标记：

- 待复核
- 文件异常
- 无法打开
- Word 待写入

并记录原因和最后处理页码。

---

## 二十一、每日运行要求

1. 每个自然日至少处理 2 份 PDF。
2. “处理”以完成该 PDF 的真实阅读、核验、写入和保存为准。
3. 仅扫描目录、仅运行 OCR、仅搜索关键词，不计为完成。
4. 如 PDF 特别庞大，无法在当日完成 2 份，应：
   - 持续推进当前文件；
   - 记录实际已读页码；
   - 记录已核页和候选页；
   - 不得虚报完成；
   - 在日志中说明原因。
5. 未经用户叫停，完成当前文件后继续下一份。
6. 不得为满足数量要求降低原页核验标准。
7. 用户调整最低处理数量后，以最新配置为准。

---

## 二十二、异常处理

### 无法读取 PDF

记录：

- 文件名
- 错误信息
- 是否加密
- 是否损坏
- 是否能提取部分页面
- 是否需要重新扫描

### OCR 质量过低

- 尝试调整分辨率、方向和页面范围；
- 对候选页查看原图；
- 无法辨认处标“〔字迹不清，待核〕”；
- 不得据 OCR 猜字。

### Word 被占用

- 不覆盖失败；
- 将结构化数据和断点先保存；
- 记录“Word 被占用，待写入”；
- Word 成功更新前不得将对应 PDF 标为最终完成。

### 页码体系异常

分别识别：

- PDF 页码
- 书内页码
- 卷内连续页码
- 插页
- 重复页
- 缺页

页码无法确认时明确标注，不得自行换算。

### 文件名变化

如已处理 PDF 被重命名：

1. 通过文件哈希、页数和内容核对身份；
2. 更新文件清单；
3. 保留旧文件名记录；
4. 不得把同一文件当作新文件重复处理。

---

## 二十三、全部 PDF 完成后的总复核

全部 PDF 完成后进行一次全库复核，重点检查：

1. 是否漏写完整书名。
2. 是否混淆书内页码和 PDF 页码。
3. 是否存在 OCR 错字。
4. 是否存在来源拼接。
5. 是否擅补主语、机关、时间或层级。
6. 是否扩大个案适用范围。
7. 是否强化原文因果。
8. 是否把部署写成落实。
9. 是否把后来回忆当作同时期原始材料。
10. 是否有重复条目。
11. 条目序号是否连续。
12. 主要分类是否准确。
13. 关联主题是否一致。
14. 建议引文格式是否满足核验条件。
15. 进度表条数是否与正文正式条目一致。
16. 重复 PDF 标记是否准确。
17. 是否存在“已完成”但缺少原页核验的文件。
18. Word 是否可正常打开。
19. 标题层级、字体、段落和表格是否完整。
20. 是否形成可供研究写作和引文复核使用的证据库。
21. 是否有用户未设置却被擅自补入的研究对象、分类或结论。
22. 任务配置、Word 分类和条目字段是否一致。

复核完成后，在文档开头增加“总复核说明”，报告：

- PDF 总数
- 完成数
- 重复数
- 异常数
- 正式史料条数
- 待核线索数
- 各主题条目数
- 尚待处理的问题

---

## 二十四、禁止行为

严禁：

- 只按关键词筛选文件；
- 未看原页即标记完成；
- 将 OCR 文本直接当作正式引文；
- 擅自修正文献原文；
- 擅补主语、时间、机关和层级；
- 混淆书内页码与 PDF 页码；
- 拼接不同来源；
- 将同一史料复制到多个主题章节冒充多份证据；
- 把个案扩大为整体；
- 把计划扩大为结果；
- 把后续措施反推为此前问题的必然证明；
- 为追求每日数量虚报完成；
- 覆盖或删除用户已有条目；
- 改变已核引文而不保留修改记录；
- 跳过进度表直接处理后续文件；
- 重复摘录已经完成的同一来源同一材料；
- 擅自替用户确定研究主题、核心问题、重点检索和分类体系；
- 将示例内容当作真实任务参数写入正式文档。

---

## 二十五、运行结束与停止条件

### 持续条件

除非用户明确叫停，否则：

1. 完成当前 PDF；
2. 更新 Word；
3. 保存断点；
4. 继续下一份 PDF。

### 可停止情形

仅在以下情况暂停：

- 用户明确要求停止；
- 所有 PDF 已完成并完成总复核；
- 文件系统或 Word 持续不可写；
- 输入目录不存在；
- 所有剩余 PDF 均损坏或无法访问；
- 运行环境即将关闭且已完成安全保存。

暂停前必须保存：

- 断点
- 结构化条目
- 日志
- 已完成的 Word 更新

不得声称将在后台继续运行。再次启动时，应从断点和 Word 进度表继续。

---

