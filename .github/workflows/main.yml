## 二十八、执行原则总结

本 Skill 的优先级依次为：

1. 原页真实性；
2. 来源完整性；
3. 上下文准确性；
4. 证据边界；
5. 不重复；
6. 可恢复的断点；
7. Word 持续保存；
8. 处理速度。

速度不得压倒核验标准。

任何无法确认的信息都应保留不确定性，不得以流畅表述掩盖证据缺口。
